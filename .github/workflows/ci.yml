name: Security CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: API tests
        run: ./mvnw -B test
      - name: SAST - SpotBugs
        run: ./mvnw -B -DskipTests spotbugs:spotbugs spotbugs:check
      - name: Restore vulnerability database
        uses: actions/cache/restore@v6
        with:
          path: .dependency-check-data
          key: dependency-check-${{ runner.os }}-12.2.2-${{ github.run_id }}
          restore-keys: dependency-check-${{ runner.os }}-12.2.2-
      - name: SCA - OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -DskipTests dependency-check:check
      - name: Save vulnerability database
        if: ${{ always() && hashFiles('target/dependency-check-report.html') != '' }}
        uses: actions/cache/save@v6
        with:
          path: .dependency-check-data
          key: dependency-check-${{ runner.os }}-12.2.2-${{ github.run_id }}
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            target/spotbugsXml.xml
            target/dependency-check-report.html
          if-no-files-found: warn
